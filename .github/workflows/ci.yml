name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.0'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Lint & Format (Ruff)
        run: | 
          ruff check src/ frontend/ scripts/ --no-cache .
          ruff format --check src/ frontend/ scripts/ --no-cache .

      - name: Type check (Mypy)
        run: mypy .

      # Блок Docker мы оставляем, чтобы убедиться, что файл docker-compose.yml не сломан
      - name: Build Docker
        run: docker compose build
